# Everything runs on this machine, and every port is bound to 127.0.0.1 only (docs/adr/0001).
#   docker compose up -d db     database only, for running the API and web app from your IDE
#   docker compose up -d        the whole app at http://localhost:8081
services:
  db:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: jobsearch
      POSTGRES_USER: jobsearch
      POSTGRES_PASSWORD: jobsearch
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobsearch -d jobsearch"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/jobsearch
      # Inside the container the API must accept connections from the web container;
      # the port mapping below still keeps it off the network
      SERVER_ADDRESS: 0.0.0.0
      TZ: ${TZ:-America/Chicago}
      # Job-alert emails from Gmail (optional; see docs/gmail-setup.md). Values come from .env
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GMAIL_LABEL: ${GMAIL_LABEL:-Job alerts}
      # Claude, for match scores and drafted messages (optional). Values come from .env
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-claude-opus-5-5}
      AI_DAILY_LIMIT: ${AI_DAILY_LIMIT:-30}
      AI_REQUEST_CAP: ${AI_REQUEST_CAP:-150}
      RESUME_DIR: /app/private
    volumes:
      # The resume, read-only; private/ is git-ignored
      - ./private:/app/private:ro
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health/readiness | grep -q UP"]
      interval: 10s
      timeout: 3s
      retries: 12
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./frontend
    ports:
      - "127.0.0.1:8081:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  db-data:
