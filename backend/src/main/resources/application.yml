spring:
  application:
    name: job-search-assistant
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/jobsearch}
    username: ${DB_USER:jobsearch}
    password: ${DB_PASSWORD:jobsearch}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  mvc:
    problemdetails:
      enabled: true
  http:
    client:
      # A slow job board must not stall the whole sync
      connect-timeout: 5s
      read-timeout: 30s

server:
  # Single user on their own machine: never listen on the network (ADR 0001)
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${PORT:8080}
  # Finish in-flight requests on shutdown, and trust X-Forwarded-* from a reverse proxy (ADR 0005)
  shutdown: graceful
  forward-headers-strategy: native

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173}
  sync:
    enabled: ${SYNC_ENABLED:true}
    # Daily at 07:00 in the server's time zone (set TZ in docker-compose.yml)
    cron: ${SYNC_CRON:0 0 7 * * *}
  http:
    user-agent: "job-search-assistant/0.1 (personal job search; one sync a day)"
    # Search-based feeds (Amazon, Google, Workday) take many pages; space them out like a person would
    page-delay: 750ms
    max-pages: 60
  jobs:
    new-window: 24h
    # Roles posted longer ago than this aren't imported
    max-age: ${JOBS_MAX_AGE:30d}
    us-only: ${JOBS_US_ONLY:true}
  tracker:
    # When to remind the owner to follow up on a message with no reply
    follow-up-after: ${FOLLOW_UP_AFTER:5d}
  gmail:
    # A Google OAuth client of type "Web application" (docs/gmail-setup.md). Empty turns the feature off.
    client-id: ${GOOGLE_CLIENT_ID:}
    client-secret: ${GOOGLE_CLIENT_SECRET:}
    # Must match an authorised redirect URI on that client
    redirect-uri: ${GMAIL_REDIRECT_URI:http://localhost:8081/api/gmail/callback}
    # The Gmail label job-alert emails are filed under
    label: ${GMAIL_LABEL:Job alerts}
  ai:
    # Claude, for match scores and drafted messages. Empty key turns the feature off.
    api-key: ${ANTHROPIC_API_KEY:}
    model: ${AI_MODEL:claude-opus-5-5}
    # New roles scored automatically after each daily sync; each one is a paid API call
    daily-limit: ${AI_DAILY_LIMIT:30}
    # Where the resume lives (git-ignored). The newest .pdf, .md or .txt file is used.
    resume-dir: ${RESUME_DIR:../private}
